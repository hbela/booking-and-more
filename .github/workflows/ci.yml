name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the local dev setup (native PostgreSQL 18).
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_and_more?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_and_more_test?schema=public
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_and_more_shadow?schema=public
  APP_BASE_URL: http://localhost:3000
  API_BASE_URL: http://localhost:3001
  NEXT_PUBLIC_API_BASE_URL: https://api.example.test
  CUSTOMER_PII_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
  CUSTOMER_PII_BLIND_INDEX_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
  LAUNCH_ACCESS_MODE: public

jobs:
  linux-images:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: ci-postgres-only
      REDIS_PASSWORD: ci-redis-only
      BETTER_AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      APP_BASE_URL: https://app.example.test
      API_BASE_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v5
      - name: Build the production Linux images
        run: docker compose -p bam-ci -f docker/docker-compose.yml build
      - name: Start isolated database and queue
        run: docker compose -p bam-ci -f docker/docker-compose.yml up -d --wait postgres redis
      - name: Migrate the empty image-test database
        run: docker compose -p bam-ci -f docker/docker-compose.yml run --rm --no-deps -w /app/packages/db api ./node_modules/.bin/prisma migrate deploy
      - name: Start and check all application images
        run: |
          docker compose -p bam-ci -f docker/docker-compose.yml up -d --wait --wait-timeout 180 api worker web
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:3001/health/ready
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/sign-in >/dev/null
          curl --fail http://127.0.0.1:3000/en/sign-in >/dev/null
      - name: Report failed container checks
        if: failure()
        run: docker compose -p bam-ci -f docker/docker-compose.yml logs --tail 80
      - name: Stop isolated CI stack
        if: always()
        run: docker compose -p bam-ci -f docker/docker-compose.yml down

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # tech-impl §39.3 specifies Testcontainers, which needs a Docker daemon we
    # do not have on the dev machine. A service container gives the integration
    # tests the same PostgreSQL 18 with the same extensions instead.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_and_more
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependencies only; high and critical advisories block the
      # build. A temporary exception must be an explicit reviewed override in
      # package.json, never an ignored audit failure in this workflow.
      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Verify backup failure handling
        run: python3 ops/production/test-backup.py

      - name: Check formatting
        run: pnpm format:check

      - name: Create the test and shadow databases
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres booking_and_more_test
          PGPASSWORD=postgres createdb -h localhost -U postgres booking_and_more_shadow

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      # The step that would have prevented the predecessor project's worst
      # incident. `prisma migrate status` does NOT catch this: it reports which
      # migrations were applied, not whether applying them reproduces the schema.
      - name: Check for migration drift
        run: pnpm db:drift-check

      - name: Apply migrations to the test database
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium for browser smoke tests
        run: pnpm --filter @bam/web exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e

      # A migration that cannot be applied to an empty database is broken, even
      # if it happens to work against the current one.
      - name: Verify migrations apply from scratch
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres booking_and_more_scratch
          pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_and_more_scratch?schema=public
