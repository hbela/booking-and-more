# Full stack for Coolify / Hetzner. tech-impl §41.
#
# NOTE: this is not the local development path. The dev machine has no Docker;
# local work runs against native PostgreSQL 18 with `pnpm dev`. This file exists
# so production parity is defined and reviewable from Phase 0 rather than
# improvised at deploy time. See docs/phase-0-technical-foundation.md §4.
#
#   docker compose -f docker/docker-compose.yml up --build

name: booking-and-more

services:
  # POSTGRES_PASSWORD and REDIS_PASSWORD are both embedded into URLs below, so
  # both must be URL-safe: `openssl rand -hex 32`, never `-base64`. See
  # docker-compose.coolify.yml and phase-10 §2.9.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-booking_and_more}
    # A level above /data on purpose — the postgres:18+ images refuse to start
    # when the old path is a mount point. See docker-compose.coolify.yml.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the API and worker need it.
    expose:
      - "5432"

  redis:
    # Unused until Epic 5 (BullMQ, outbox dispatch, distributed rate limiting).
    # Declared now so the topology is complete and the API/worker can pick it up
    # by setting REDIS_URL, with no compose change required.
    image: redis:8-alpine
    restart: unless-stopped
    # Password-protected here too, so the parity check exercises the same
    # connection string shape production uses. See docker-compose.coolify.yml
    # for why the healthcheck greps rather than trusting redis-cli's exit code.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD}",
      ]
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3001
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_and_more}?schema=public
      SENTRY_DSN: ${SENTRY_DSN:-}
      # REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3001:3001"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_and_more}?schema=public
      SENTRY_DSN: ${SENTRY_DSN:-}
      # REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Inlined at build time, so a change here needs a rebuild, not a restart.
        NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
