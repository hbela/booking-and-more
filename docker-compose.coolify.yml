# Coolify deployment stack — Hetzner VPS. See
# docs/phase-10-deployment-hetzner-coolify.md for the walkthrough this file is
# the other half of.
#
# This is NOT docker/docker-compose.yml. That one publishes host ports and is
# for local parity checks; this one publishes nothing, because Coolify's Traefik
# reaches the containers over its own network and a published port would sit
# outside the proxy — unrouted, untrusted and un-TLS'd, on the public IP of the
# VPS.
#
# Set "Docker Compose Location" to /docker-compose.coolify.yml with the base
# directory left at /, so `context: .` below is the repository root.
#
# `exclude_from_hc` on the migrate service is a Coolify extension, not Compose
# syntax. `docker compose config` will reject this file locally for that one
# key; that is expected, and docker/docker-compose.yml is what to use locally.

name: booking-and-more

# ---------------------------------------------------------------------------
# The API and the worker take almost the same environment, and every one of
# these variables has to be right in both places or a failure appears in only
# half the system — the API sells a subscription the worker then cannot email
# about. One anchor, so they cannot drift.
#
# Mapping form rather than the list form this used to have, because `api` needs
# one variable of its own (SERVICE_FQDN_API_3001) alongside the shared set, and
# YAML can merge two mappings but cannot concatenate two sequences.
#
# The list form existed to express "unset" precisely: plain `docker compose`
# omits a bare pass-through key rather than setting it to "". That distinction
# no longer has to be carried here — `@bam/config` drops empty values before
# validating (§2.6), so `${KEY:-}` and an absent key mean the same thing to
# every process in this stack. That is what makes mapping form safe now.
# ---------------------------------------------------------------------------
x-app-environment: &app-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}

  # Public origins. These are the app's identity, not decoration: APP_BASE_URL
  # is the sole allowed CORS origin and the sole trusted origin for auth
  # cookies, and both are what emailed links are built from via `buildAppUrl`.
  # They must match the domains Coolify routes, exactly — scheme included, no
  # trailing slash. A bare hostname fails the web build outright (§2.7).
  APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL to the web app's public https origin}
  API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL to the API's public https origin}

  # Both of these embed a password into a URL, so both passwords must be
  # URL-safe. Generate them with `openssl rand -hex 32`, NOT `-base64`: base64's
  # alphabet includes `/`, and a `/` in the userinfo ends the authority as far
  # as every URL parser is concerned, so `postgresql://u:ab/cd@postgres:5432/db`
  # parses as host `u:ab`. @bam/config rejects both at boot for exactly this
  # (packages/config/src/schema.ts), rather than letting it surface as a
  # connection error naming a host nobody typed. See §2.9.
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_and_more}?schema=public
  REDIS_URL: redis://default:${REDIS_PASSWORD:?set REDIS_PASSWORD, and see §2.9 before choosing one}@redis:6379

  # Rotating this signs every live session out. Generate once, then leave alone:
  #   openssl rand -base64 32
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET, at least 32 characters}

  # Optional. Each group is all-or-nothing and the config schema says so at
  # boot rather than at first use. Leaving any of them blank is the supported
  # way to say "not configured".
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
  STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

  # Tunables. Defaults live in packages/config/src/schema.ts; these are here so
  # they can be changed without a code deploy.
  TRIAL_PERIOD_DAYS: ${TRIAL_PERIOD_DAYS:-}
  ONBOARDING_WINDOW_DAYS: ${ONBOARDING_WINDOW_DAYS:-}
  INVITATION_EXPIRY_HOURS: ${INVITATION_EXPIRY_HOURS:-}
  BOOKING_REMINDER_LEAD_HOURS: ${BOOKING_REMINDER_LEAD_HOURS:-}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-booking_and_more}
    # /var/lib/postgresql, NOT /var/lib/postgresql/data.
    #
    # The 18+ images store data in a major-version-specific subdirectory so that
    # `pg_upgrade --link` does not have to cross a mount boundary, and they
    # refuse to start — not warn, refuse — if the old path is a mount point.
    # Mounted a level up, the data lands in /var/lib/postgresql/18/docker and an
    # eventual 19 upgrade has both versions inside one volume.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports. The database is reachable only from this stack's network; to get
    # a psql prompt, open a terminal on this container from Coolify.
    expose:
      - "5432"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # appendonly, because the queue holds scheduled reminders. Losing them on a
    # restart is survivable — the notification sweep re-finds rows the queue no
    # longer has (docs/phase-5-booking-notifications.md §2.5) — but it is a
    # recovery path, not a plan.
    #
    # requirepass, because "reachable only from the internal network" is an
    # assumption about the host, and on 2026-08-04 that assumption was wrong
    # about the database (§2.9). An unauthenticated Redis that becomes reachable
    # is worse than an exposed Postgres: no password to fail, and CONFIG SET is
    # a documented path from read access to code execution on the box.
    #
    # The password lands in the container's argv, so anyone who can read `ps` on
    # the host can read it — which is a description of root, who could read the
    # env file anyway. Not worth a config file and a bind mount to avoid.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD, and see §2.9 before choosing one}",
      ]
    volumes:
      - redis-data:/data
    # Only for the healthcheck below — nothing in the image reads this name.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      # A bare `redis-cli ping` answers NOAUTH once requirepass is set, and
      # redis-cli exits 0 having printed an error — so the container would look
      # healthy while every real client was rejected. `grep -q PONG` is what
      # makes the check test the thing it claims to.
      #
      # `$$` is escaped for Compose so the container's shell expands it, keeping
      # the password out of the rendered healthcheck string.
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  # -------------------------------------------------------------------------
  # Schema, before anything that depends on it runs.
  #
  # Built from Dockerfile.api rather than an image of its own, so the migration
  # applied is the one committed alongside the code that expects it — a separate
  # image could be a different commit, which is precisely the drift CLAUDE.md
  # rule 1 exists to prevent. It runs `prisma migrate deploy`, which only ever
  # applies migration files that are already committed; it cannot invent one.
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: api
    restart: "no"
    # Coolify treats a stopped container as unhealthy and would report a red
    # stack after every successful deploy. This is the documented opt-out.
    exclude_from_hc: true
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/packages/db
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booking_and_more}?schema=public

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # A failed migration stops the deploy here rather than letting an API boot
      # against a schema it does not match.
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      # This is what gives the API a domain, and without it there is no route.
      #
      # Coolify's magic variables: seeing SERVICE_FQDN_<SERVICE>_<PORT> named
      # here, it generates an FQDN, exposes it as an editable field on the
      # resource, and writes the Traefik labels that terminate TLS and forward
      # to container port 3001. `expose` alone does none of that — it is a note
      # to a human. The first deployment had every container healthy and
      # nothing reachable for exactly this reason: no FQDN anywhere in the
      # stack, so no router, an empty Links dropdown and a refused connection
      # (§2.8).
      #
      # Edit the generated value in Coolify to your own host, and make it agree
      # with API_BASE_URL exactly.
      SERVICE_FQDN_API_3001: ${SERVICE_FQDN_API_3001:-}
    expose:
      - "3001"

  worker:
    build:
      context: .
      # Share the backend build stage with api/migrate so the generated Prisma
      # client is compiled once. The final image remains worker-only.
      dockerfile: docker/Dockerfile.api
      target: worker-runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No domain and no exposed port: it dispatches the outbox and drains queues,
    # and answers nothing.
    environment: *app-environment

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Inlined into the client bundle at build time, so this needs a rebuild
        # to change — a restart will not do it. It is the same value as
        # API_BASE_URL and is separate only because Next.js requires the
        # NEXT_PUBLIC_ prefix to expose it to the browser.
        NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL to the API's public https origin}
    restart: unless-stopped
    # Not depends_on api: every call to the API is made by the browser
    # (apps/web/src/lib/api-client.ts is a client module), so the web container
    # never talks to it and can serve pages while the API is restarting.
    environment:
      NODE_ENV: production
      # As on the API above: this is what earns the web app a domain and a
      # Traefik route to container port 3000. Edit the generated value in
      # Coolify to your own host, and make it agree with APP_BASE_URL exactly —
      # a mismatch here is a CORS rejection on every browser request, and the
      # API is the only thing that can see it.
      SERVICE_FQDN_WEB_3000: ${SERVICE_FQDN_WEB_3000:-}
    expose:
      - "3000"

volumes:
  postgres-data:
  redis-data:
